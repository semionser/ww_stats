name: serve
# Один запуск живёт ~5 ч 45 мин и в конце сам ставит следующий (job next). Расписание — запасной путь:
# GitHub запускает его с опозданием на часы, и одно расписание оставляло бота без связи.
# Push в main или ручной запуск перезапускает с новым кодом. pull_request намеренно не используется:
# чужие форки не могут запустить этот workflow и не получают секреты.
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Разово прислать пример сообщения в группу"
        type: choice
        options: [none, now, summaries, records, payout, urgent, delete_last, summaries+records, summaries+records+payout, selftest+exit, supply_acceptance, upd, upd_yes, supply_acceptance+upd]
        default: none
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: serve
  # push и ручной запуск сменяют бота сразу; следующая смена от job next ждёт, пока текущая допишет (секунды)
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.actor != 'github-actions[bot]' }}
jobs:
  serve:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
    steps:
      # действия закреплены по хешу коммита, а не по тегу
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "3.12"}
      # установка иногда падает из-за сбоя зеркал: пробуем до 3 раз, иначе бот простоял бы до следующего запуска
      - run: |
          for i in 1 2 3; do
            pip install -q --require-hashes --only-binary=:all: -r requirements.txt && exit 0
            echo "pip: попытка $i не удалась"; sleep 30
          done
          exit 1
      - name: Restore state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with: {path: state, key: "state-${{ github.run_id }}", restore-keys: "state-"}
      - name: Serve
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          PRODUCTS_JSON: ${{ secrets.PRODUCTS_JSON }}
          UPD_SIGNER: ${{ secrets.UPD_SIGNER }}
          DAILY_TIME: "09:00"
          SERVE_SECONDS: "20700"
          DEMO: ${{ inputs.demo }}
          RENDER_READY: ${{ runner.temp }}/render-ready
        # Chromium и шрифт Inter ставим в фоне, без секретов в окружении: бот выходит на связь сразу, а картинки
        # ждут установку (render.py, до 3 мин). Раньше бот ждал установку до запуска, а apt иногда тормозит
        # по 5–10 минут — всё это время на смене никого не было и команды оставались без ответа.
        # Системные библиотеки для Chromium на раннере GitHub уже есть (там стоит Chrome), install-deps — на всякий случай.
        run: |
          env -u TELEGRAM_BOT_TOKEN -u OZON_API_KEY -u OZON_CLIENT_ID -u PRODUCTS_JSON -u UPD_SIGNER -u ALLOWED_CHAT_ID -u ALLOWED_USER_IDS \
            bash -c 'for i in 1 2 3; do timeout 300 python -m playwright install chromium > pw.log 2>&1 && break; echo "chromium: попытка $i не удалась"; sleep 20; done
                     touch "$RENDER_READY"
                     timeout 900 python -m playwright install-deps chromium > pw-deps.log 2>&1 || echo "chromium deps: не установились"
                     timeout 600 sudo apt-get install -y -q --no-install-recommends fonts-inter > /dev/null 2>&1 || echo "fonts-inter не установился, будет системный шрифт"' &
          python bot.py
      - name: Save state
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with: {path: state, key: "state-${{ github.run_id }}-${{ github.run_attempt }}"}
  next:
    # Смена закончилась — запускаем следующую сразу, не дожидаясь расписания. Если смена упала (например, сбой
    # установки), следующую ставим через 5 минут, чтобы при долгом сбое не крутиться подряд. Отменённый запуск (push,
    # ручной запуск) ничего не ставит, иначе запуски отменяли бы друг друга по кругу. Код из репозитория здесь
    # не выполняется, секретов нет; у токена только право запускать workflow этого репозитория.
    needs: serve
    if: needs.serve.result == 'success' || needs.serve.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - if: needs.serve.result == 'failure'
        run: sleep 300
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X POST "repos/$REPO/actions/workflows/serve.yml/dispatches" -f ref=main -f "inputs[demo]=none"
